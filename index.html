<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Diner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #101012;
  --text: #ece9e2;
  --dim: #706c66;
  --line: #232323;
  --accent: #c9584a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
}
.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding: 120px 32px 160px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 80px;
  align-items: start;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 18px;
}
h1 {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-weight: 400;
  font-size: 56px;
  line-height: 1.05;
  margin-bottom: 64px;
}
.section {
  margin-bottom: 56px;
}
.section-label {
  font-size: 12px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 22px;
}
.row {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.row:first-of-type { border-top: 1px solid var(--line); }
.row-name {
  font-size: 17px;
  white-space: nowrap;
}
.row-desc {
  font-size: 13px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-fill {
  flex: 1;
  border-bottom: 1px dotted var(--line);
  transform: translateY(-4px);
}
.row-price {
  font-size: 15px;
  color: var(--accent);
  white-space: nowrap;
}
.row:hover .row-name { color: var(--accent); }
.row-out {
  cursor: default;
  opacity: 0.55;
}
.row-out:hover .row-name { color: var(--text); }
.row-out .row-desc {
  color: var(--accent);
}
.add-custom {
  margin-top: 22px;
  font-size: 13px;
  color: var(--dim);
  cursor: pointer;
  display: inline-block;
  border-bottom: 1px solid var(--dim);
}
.add-custom:hover { color: var(--accent); border-color: var(--accent); }

.custom-form {
  display: none;
  gap: 10px;
  margin-top: 18px;
  align-items: baseline;
}
.custom-form.open { display: flex; }
.custom-form input {
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--line);
  padding: 8px 0;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
}
.custom-form input:focus { outline: none; border-color: var(--accent); }
.custom-form input.custom-name { flex: 1; }
.custom-form .custom-price-note {
  font-size: 12px;
  color: var(--dim);
  white-space: nowrap;
}
.custom-form button {
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--text);
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 0 16px;
  height: 32px;
  cursor: pointer;
}
.custom-form button:hover { border-color: var(--accent); color: var(--accent); }

.history-row {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.history-row:first-of-type { border-top: 1px solid var(--line); }
.history-top {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}
.history-items {
  font-size: 12.5px;
  color: var(--dim);
  margin-top: 4px;
}
.history-empty {
  font-size: 13px;
  color: var(--dim);
  padding: 16px 0;
}

.receipt {
  position: sticky;
  top: 80px;
  background: #f2ede2;
  color: #201c16;
  font-family: 'JetBrains Mono', monospace;
  padding: 32px 26px;
  box-shadow: 0 30px 60px #00000080;
}
.receipt::before {
  content: "";
  display: block;
  height: 8px;
  margin: -32px -26px 24px;
  background:
    linear-gradient(135deg, transparent 50%, var(--bg) 50%) 0 0 / 12px 8px repeat-x,
    linear-gradient(-135deg, transparent 50%, var(--bg) 50%) 0 0 / 12px 8px repeat-x;
  background-position: bottom left, bottom left;
}
.receipt-title {
  text-align: center;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.receipt-sub {
  text-align: center;
  font-size: 10.5px;
  color: #6b6255;
  letter-spacing: 1px;
  margin-bottom: 18px;
}
.receipt-divider {
  border-top: 1px dashed #c4bba9;
  margin: 16px 0;
}
.receipt-row {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  padding: 6px 0;
}
.receipt-empty {
  font-size: 12.5px;
  color: #8a7d68;
  padding: 6px 0 2px;
}
.receipt-qty {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #6b6255;
}
.qty-btn {
  cursor: pointer;
  color: #201c16;
  user-select: none;
}
.qty-btn:hover { color: var(--accent); }

.fields { margin-top: 4px; }
.field { margin-top: 20px; }
.field label {
  display: block;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #6b6255;
  margin-bottom: 7px;
}
.field input, .field textarea {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #c4bba9;
  padding: 7px 0;
  color: #201c16;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
}
.field input::placeholder, .field textarea::placeholder { color: #a89e8c; }
.field input:focus, .field textarea:focus {
  outline: none;
  border-color: var(--accent);
}
.field input:disabled { color: #8a7d68; }
.field textarea { resize: none; height: 40px; }

.toggle-row {
  display: flex;
  gap: 22px;
  margin-top: 2px;
}
.toggle-opt {
  font-size: 12.5px;
  color: #6b6255;
  cursor: pointer;
  padding-bottom: 4px;
  border-bottom: 1px solid transparent;
}
.toggle-opt.active {
  color: #201c16;
  border-bottom-color: var(--accent);
}

.total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-top: 26px;
  padding-top: 16px;
  border-top: 1px dashed #c4bba9;
}
.total-label {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #6b6255;
}
.total-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}
.send-btn {
  margin-top: 22px;
  width: 100%;
  padding: 13px;
  background: #201c16;
  border: none;
  color: #f2ede2;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
}
.send-btn:hover { background: var(--accent); }
.send-btn:disabled {
  background: #4a443a;
  cursor: not-allowed;
}
.error-msg {
  margin-top: 12px;
  font-size: 11.5px;
  color: var(--accent);
  display: none;
}
.error-msg.show { display: block; }

footer {
  grid-column: 1 / -1;
  text-align: center;
  padding-top: 80px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--dim);
}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="eyebrow">Family &middot; Late Night</div>
    <h1>Midnight Diner</h1>

    <div id="menuContainer"></div>

    <div class="section">
      <div class="section-label">Recent Orders</div>
      <div id="historyContainer"></div>
    </div>
  </div>

  <div class="receipt">
    <div class="receipt-title">Guest Check</div>
    <div class="receipt-sub" id="receiptNumber">No. 0001</div>
    <div class="receipt-divider"></div>

    <div id="receiptItems"></div>

    <div class="fields">
      <div class="field">
        <label>Name</label>
        <input type="text" id="nameInput" placeholder="Who's ordering?">
      </div>

      <div class="field">
        <label>Dine In or Delivery</label>
        <div class="toggle-row">
          <span class="toggle-opt active" id="toggleDineIn">Dine In</span>
          <span class="toggle-opt" id="toggleDelivery">Delivery</span>
        </div>
      </div>

      <div class="field">
        <label>Room</label>
        <input type="text" id="roomInput" value="Dining Room" disabled>
      </div>

      <div class="field">
        <label>Comments</label>
        <textarea id="commentsInput" placeholder="Extra cold milk, no crust, etc."></textarea>
      </div>
    </div>

    <div class="total">
      <span class="total-label">Total Due</span>
      <span class="total-value" id="totalValue">0¢</span>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="send-btn" id="sendBtn">Send Order</button>
  </div>

  <footer>Family Use Only</footer>
</div>

<script>
let MENU = [];
let WEBHOOK_URL = "";
let cart = {};
let deliveryType = "dine_in";
let orderHistory = [];

function formatPrice(cents) {
  if (cents >= 100) return "$" + (cents / 100).toFixed(2);
  return cents + "\u00a2";
}

function displayPrice(item) {
  if (item.custom && item.price === null) return "Determined by Lukas";
  return formatPrice(item.price * item.qty);
}

function renderMenu() {
  const container = document.getElementById("menuContainer");
  container.innerHTML = "";
  MENU.forEach(group => {
    const section = document.createElement("div");
    section.className = "section";

    const label = document.createElement("div");
    label.className = "section-label";
    label.textContent = group.category;
    section.appendChild(label);

    group.items.forEach(item => {
      const inStock = item.inStock !== false;
      const row = document.createElement("div");
      row.className = "row" + (inStock ? "" : " row-out");
      const descText = inStock ? item.desc : (item.outMessage || "Out of stock");
      row.innerHTML =
        '<span class="row-name">' + item.name + '</span>' +
        '<span class="row-desc">' + descText + '</span>' +
        '<span class="row-fill"></span>' +
        '<span class="row-price">' + (inStock ? formatPrice(item.price) : "\u2014") + '</span>';
      if (inStock) {
        row.addEventListener("click", () => addToCart(item.id, item.name, item.price, false));
      }
      section.appendChild(row);
    });

    container.appendChild(section);
  });

  const addLink = document.createElement("div");
  addLink.className = "add-custom";
  addLink.textContent = "+ Add a custom item";
  addLink.addEventListener("click", toggleCustomForm);
  container.appendChild(addLink);

  const form = document.createElement("div");
  form.className = "custom-form";
  form.id = "customForm";
  form.innerHTML =
    '<input type="text" class="custom-name" id="customName" placeholder="Item name">' +
    '<span class="custom-price-note">Determined by Lukas</span>' +
    '<button id="customAddBtn">Add</button>';
  container.appendChild(form);

  document.getElementById("customAddBtn").addEventListener("click", addCustomItem);
}

function toggleCustomForm() {
  document.getElementById("customForm").classList.toggle("open");
}

function addCustomItem() {
  const nameField = document.getElementById("customName");
  const name = nameField.value.trim();
  if (!name) return;
  const id = "custom_" + Date.now();
  addToCart(id, name, null, true);
  nameField.value = "";
  document.getElementById("customForm").classList.remove("open");
}

function addToCart(id, name, price, custom) {
  if (cart[id]) {
    cart[id].qty += 1;
  } else {
    cart[id] = { id, name, price, qty: 1, custom };
  }
  renderReceipt();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  renderReceipt();
}

function calcTotal() {
  return Object.values(cart).reduce((sum, item) => sum + (item.price === null ? 0 : item.price * item.qty), 0);
}

function renderReceipt() {
  const container = document.getElementById("receiptItems");
  const entries = Object.values(cart);
  if (entries.length === 0) {
    container.innerHTML = '<div class="receipt-empty">Your check is empty</div>';
  } else {
    container.innerHTML = "";
    entries.forEach(item => {
      const row = document.createElement("div");
      row.className = "receipt-row";
      row.innerHTML =
        '<span>' + item.qty + 'x ' + item.name + '</span>' +
        '<div class="receipt-qty">' +
        '<span class="qty-btn" data-id="' + item.id + '" data-delta="-1">\u2212</span>' +
        '<span class="qty-btn" data-id="' + item.id + '" data-delta="1">+</span>' +
        '<span style="width: 90px; text-align: right; color: #201c16;">' + displayPrice(item) + '</span>' +
        '</div>';
      container.appendChild(row);
    });
    container.querySelectorAll(".qty-btn").forEach(btn => {
      btn.addEventListener("click", () => changeQty(btn.dataset.id, parseInt(btn.dataset.delta, 10)));
    });
  }
  document.getElementById("totalValue").textContent = formatPrice(calcTotal());
}

function setDeliveryType(type) {
  deliveryType = type;
  const dineBtn = document.getElementById("toggleDineIn");
  const delBtn = document.getElementById("toggleDelivery");
  const roomInput = document.getElementById("roomInput");
  if (type === "dine_in") {
    dineBtn.classList.add("active");
    delBtn.classList.remove("active");
    roomInput.value = "Dining Room";
    roomInput.disabled = true;
  } else {
    delBtn.classList.add("active");
    dineBtn.classList.remove("active");
    roomInput.value = "";
    roomInput.placeholder = "Which room?";
    roomInput.disabled = false;
    roomInput.focus();
  }
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("show");
}

function clearError() {
  const el = document.getElementById("errorMsg");
  el.textContent = "";
  el.classList.remove("show");
}

async function sendOrder() {
  clearError();
  const name = document.getElementById("nameInput").value.trim();
  const room = document.getElementById("roomInput").value.trim();
  const comments = document.getElementById("commentsInput").value.trim();
  const items = Object.values(cart);

  if (items.length === 0) {
    showError("Add at least one item first.");
    return;
  }
  if (!name) {
    showError("Enter a name.");
    return;
  }
  if (deliveryType === "delivery" && !room) {
    showError("Enter which room it's going to.");
    return;
  }

  const order = {
    id: "ord_" + Date.now(),
    name,
    room: deliveryType === "dine_in" ? "Dining Room" : room,
    deliveryType,
    items: items.map(i => ({ name: i.name, price: i.price, qty: i.qty, custom: !!i.custom })),
    total: calcTotal(),
    comments,
    timestamp: new Date().toISOString()
  };

  const btn = document.getElementById("sendBtn");
  btn.disabled = true;
  btn.textContent = "Sending...";

  await sendToDiscord(order);
  saveOrderLocally(order);

  btn.textContent = "Order Sent!";
  setTimeout(() => {
    btn.textContent = "Send Order";
    btn.disabled = false;
  }, 1800);

  cart = {};
  document.getElementById("nameInput").value = "";
  document.getElementById("commentsInput").value = "";
  setDeliveryType("dine_in");
  renderReceipt();
  renderHistory();
}

async function sendToDiscord(order) {
  if (!WEBHOOK_URL || WEBHOOK_URL.indexOf("PASTE_YOUR") === 0) return;
  const lines = order.items.map(i => i.qty + "x " + i.name + " \u2014 " + (i.price === null ? "Determined by Lukas" : formatPrice(i.price * i.qty))).join("\n");
  const payload = {
    embeds: [{
      title: "New Order",
      color: 13189706,
      fields: [
        { name: "Name", value: order.name, inline: true },
        { name: "Room", value: order.room, inline: true },
        { name: "Type", value: order.deliveryType === "dine_in" ? "Dine In" : "Delivery", inline: true },
        { name: "Items", value: lines },
        { name: "Total", value: formatPrice(order.total), inline: true },
        { name: "Comments", value: order.comments || "\u2014" }
      ],
      timestamp: order.timestamp
    }]
  };
  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (e) {}
}

function loadLocalOrders() {
  try {
    const raw = localStorage.getItem("orders");
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveOrderLocally(order) {
  const existing = loadLocalOrders();
  existing.push(order);
  localStorage.setItem("orders", JSON.stringify(existing));
  orderHistory = existing;
}

async function loadConfig() {
  try {
    const res = await fetch("config.json");
    if (res.ok) {
      const data = await res.json();
      WEBHOOK_URL = data.webhookUrl || "";
    }
  } catch (e) {}
}

async function loadMenu() {
  try {
    const res = await fetch("menu.json");
    if (res.ok) MENU = await res.json();
  } catch (e) {
    MENU = [];
  }
  renderMenu();
}

function loadOrders() {
  orderHistory = loadLocalOrders();
  renderHistory();
}

function renderHistory() {
  const container = document.getElementById("historyContainer");
  const sorted = orderHistory.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 8);

  if (sorted.length === 0) {
    container.innerHTML = '<div class="history-empty">No orders yet</div>';
    return;
  }

  container.innerHTML = "";
  sorted.forEach(order => {
    const row = document.createElement("div");
    row.className = "history-row";
    const itemsSummary = order.items.map(i => i.qty + "x " + i.name).join(", ");
    const time = new Date(order.timestamp).toLocaleString();
    row.innerHTML =
      '<div class="history-top"><span>' + order.name + ' \u2014 ' + order.room + '</span><span>' + formatPrice(order.total) + '</span></div>' +
      '<div class="history-items">' + itemsSummary + ' &middot; ' + time + '</div>';
    container.appendChild(row);
  });
}

document.getElementById("toggleDineIn").addEventListener("click", () => setDeliveryType("dine_in"));
document.getElementById("toggleDelivery").addEventListener("click", () => setDeliveryType("delivery"));
document.getElementById("sendBtn").addEventListener("click", sendOrder);

renderReceipt();
loadConfig();
loadMenu();
loadOrders();

</script>
</body>
</html>
